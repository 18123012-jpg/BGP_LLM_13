! SEC-V1-07 Default Route Rejection
! Lateral peer AS 65007 at 192.0.2.7 (inbound); real block is 203.0.113.0/24.
! Invariant: the default route and private space are never accepted; 203.0.113.0/24 is accepted.
frr defaults traditional
hostname ref-sec-v1-07
!
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list BOGONS seq 5 permit 0.0.0.0/8 le 32
ip prefix-list BOGONS seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 15 permit 100.64.0.0/10 le 32
ip prefix-list BOGONS seq 20 permit 127.0.0.0/8 le 32
ip prefix-list BOGONS seq 25 permit 169.254.0.0/16 le 32
ip prefix-list BOGONS seq 30 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 35 permit 192.0.0.0/24 le 32
ip prefix-list BOGONS seq 40 permit 192.168.0.0/16 le 32
ip prefix-list BOGONS seq 45 permit 198.18.0.0/15 le 32
ip prefix-list BOGONS seq 50 permit 224.0.0.0/4 le 32
ip prefix-list BOGONS seq 55 permit 240.0.0.0/4 le 32
ip prefix-list PEER-ALLOC seq 5 permit 203.0.113.0/24
!
route-map PEER-IN deny 10
 match ip address prefix-list DEFAULT
route-map PEER-IN deny 20
 match ip address prefix-list BOGONS
route-map PEER-IN permit 30
 match ip address prefix-list PEER-ALLOC
route-map PEER-IN deny 99
!
router bgp 65000
 bgp router-id 192.0.2.250
 no bgp default ipv4-unicast
 neighbor 192.0.2.7 remote-as 65007
 !
 address-family ipv4 unicast
  neighbor 192.0.2.7 activate
  neighbor 192.0.2.7 route-map PEER-IN in
 exit-address-family
!
