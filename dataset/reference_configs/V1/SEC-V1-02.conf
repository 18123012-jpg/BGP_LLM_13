! SEC-V1-02 CGNAT and 172.16/12 Inbound Filtering
! Customer AS 65002 at 192.0.2.2 owns 198.51.100.0/24 (inbound).
! Invariant: nothing in 100.64.0.0/10 or 172.16.0.0/12 is accepted; 198.51.100.0/24 is accepted.
frr defaults traditional
hostname ref-sec-v1-02
!
ip prefix-list BOGONS seq 5 permit 0.0.0.0/8 le 32
ip prefix-list BOGONS seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 15 permit 100.64.0.0/10 le 32
ip prefix-list BOGONS seq 20 permit 127.0.0.0/8 le 32
ip prefix-list BOGONS seq 25 permit 169.254.0.0/16 le 32
ip prefix-list BOGONS seq 30 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 35 permit 192.0.0.0/24 le 32
ip prefix-list BOGONS seq 40 permit 192.168.0.0/16 le 32
ip prefix-list BOGONS seq 45 permit 198.18.0.0/15 le 32
ip prefix-list BOGONS seq 50 permit 224.0.0.0/4 le 32
ip prefix-list BOGONS seq 55 permit 240.0.0.0/4 le 32
ip prefix-list LONG seq 5 permit 0.0.0.0/0 ge 25
ip prefix-list CUST-ALLOC seq 5 permit 198.51.100.0/24
!
route-map CUST-IN deny 10
 match ip address prefix-list BOGONS
route-map CUST-IN deny 20
 match ip address prefix-list LONG
route-map CUST-IN permit 30
 match ip address prefix-list CUST-ALLOC
route-map CUST-IN deny 99
!
router bgp 65000
 bgp router-id 192.0.2.250
 no bgp default ipv4-unicast
 neighbor 192.0.2.2 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map CUST-IN in
 exit-address-family
!
