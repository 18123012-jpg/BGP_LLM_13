! SEC-V1-09 Private Space Egress to Transit
! Upstream AS 65009 at 192.0.2.9 (OUTBOUND); we announce only our own 203.0.113.0/24.
! Invariant: only 203.0.113.0/24 is announced; private space is never announced.
frr defaults traditional
hostname ref-sec-v1-09
!
ip prefix-list BOGONS seq 5 permit 0.0.0.0/8 le 32
ip prefix-list BOGONS seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 15 permit 100.64.0.0/10 le 32
ip prefix-list BOGONS seq 20 permit 127.0.0.0/8 le 32
ip prefix-list BOGONS seq 25 permit 169.254.0.0/16 le 32
ip prefix-list BOGONS seq 30 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 35 permit 192.0.0.0/24 le 32
ip prefix-list BOGONS seq 40 permit 192.168.0.0/16 le 32
ip prefix-list BOGONS seq 45 permit 198.18.0.0/15 le 32
ip prefix-list BOGONS seq 50 permit 224.0.0.0/4 le 32
ip prefix-list BOGONS seq 55 permit 240.0.0.0/4 le 32
ip prefix-list OWN-BLOCK seq 5 permit 203.0.113.0/24
!
route-map TRANSIT-OUT deny 10
 match ip address prefix-list BOGONS
route-map TRANSIT-OUT permit 20
 match ip address prefix-list OWN-BLOCK
route-map TRANSIT-OUT deny 99
!
router bgp 65000
 bgp router-id 192.0.2.250
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 192.0.2.9 remote-as 65009
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.9 activate
  neighbor 192.0.2.9 route-map TRANSIT-OUT out
 exit-address-family
!
